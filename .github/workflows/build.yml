name: Build Executables

on:
  push:
    branches: [ v2.0 ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed main.py
      - uses: actions/upload-artifact@v3
        with:
          name: windows-exe
          path: dist/Timelapse_deflicker_v2.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed main.py
      - uses: actions/upload-artifact@v3
        with:
          name: linux-appimage
          path: dist/Timelapse_deflicker_v2
