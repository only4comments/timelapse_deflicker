name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name Timelapse_deflicker_v2 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Timelapse_deflicker_v2.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name Timelapse_deflicker_v2 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/Timelapse_deflicker_v2
